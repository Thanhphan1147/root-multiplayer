services:
  root-multiplayer:
    build: .
    image: root-multiplayer:latest
    container_name: root-multiplayer
    ports:
      - "8080:8080"
    environment:
      # Set a long random value in production; it signs every seat token.
      RMN_SECRET: ${RMN_SECRET:-change-me-in-production}
    volumes:
      - rmn-data:/app/data
    restart: unless-stopped

volumes:
  rmn-data:
